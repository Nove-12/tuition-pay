<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>校园统一支付平台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: #f7f8fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 360px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #fff1f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff4d4f;
      font-size: 32px;
      font-weight: bold;
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      color: #1f2329;
      margin-bottom: 8px;
    }
    .desc {
      font-size: 14px;
      color: #8f959e;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">!</div>
    <div class="title">该二维码已失效</div>
    <div class="desc">本次缴费支付凭证已超时或已被使用，请返回教务系统重新发起缴费。</div>
  </div>
</body>
</html>
